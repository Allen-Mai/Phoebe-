function renderSelfTestView(){
  const report = SELF_TEST_REPORT;
  if (!report){ $main.innerHTML = '<h1>🧪 自检结果</h1><div class="empty">还没有自检结果。</div>'; return; }

  const bad = report.filter(function(r){ return !r.ok; }).length;
  let html = '<h1>🧪 自检结果</h1>';
  html += '<div class="meta">'
        + (bad ? '<span style="color:var(--bow);font-weight:700">❌ '+bad+' 项失败</span>'
               : '<span style="color:var(--done);font-weight:700">✅ 全部通过</span>')
        + '<span>共 '+report.length+' 项</span>'
        + '</div>';

  html += '<div class="table-wrap"><table class="grid-table"><thead><tr>'
        + '<th class="corner">📋 检查项</th><th style="min-width:70px">🎯 结果</th><th>🔎 详情</th>'
        + '</tr></thead><tbody>';
  report.forEach(function(r){
    html += '<tr><td class="rowhead">'+esc(r.label)+'</td>'
          + '<td style="color:'+(r.ok?'var(--done)':'var(--bow)')+';font-weight:700">'
          + (r.ok ? '✅ 通过' : '❌ 失败') + '</td>'
          + '<td><code>'+esc(r.detail)+'</code></td></tr>';
  });
  html += '</tbody></table></div>';

  if (bad){
    html += '<div style="margin-top:18px;background:#f9eef2;border:1px solid var(--bow);'
          + 'border-radius:10px;padding:14px 18px;color:#78324a;font-size:13.5px">'
          + '有检查项失败。<strong>请把标着「❌ 失败」的那几行整段复制发给我</strong>，我据此修复。</div>';
  } else {
    html += '<div style="margin-top:18px;background:#eef4f0;border:1px solid var(--done);'
          + 'border-radius:10px;padding:14px 18px;color:#375742;font-size:13.5px">'
          + '全部通过 —— 说明程序本身没问题。如果你看到的内容不对，是<strong>视图选择</strong>或'
          + '<strong>演示数据</strong>的问题，直接告诉我你期望看到什么就行。</div>';
  }
  $main.innerHTML = html;
}

function refreshSelfTestBadge(){
  const el = document.getElementById('selfTest');
  let report;
  try { report = runSelfTest(); }
  catch (e) { report = [{ label:'自检本身', ok:false, detail:(e && e.message) || String(e) }]; }
  SELF_TEST_REPORT = report;

  const bad = report.filter(function(r){ return !r.ok; }).length;
  if (el){
    el.textContent = bad ? ('❌ 自检：'+bad+' 项失败') : ('✅ 自检：'+report.length+' 项通过');
    el.style.color = bad ? 'var(--bow)' : 'var(--done)';
    el.style.fontWeight = '700';
    el.style.cursor = 'pointer';
  }
  render();   // 自检过程反复重绘过，这里把画面恢复成正常视图
}

function render(){
  stopSpeak();                 // 换视图 / 重绘时把正在朗读的停掉
  stopCheer();                 // 加油小伙伴的轮播计时器也一起停
  rebuildIndex();
  renderNav();
  if (state.view === 'calendar') renderCalendarView();
  else if (state.view === 'table') renderTableView();
  else if (state.view === 'ai') renderAIView();
  else if (state.view === 'selftest') renderSelfTestView();
  else if (state.view === 'search') renderSearchView();
  else if (state.view === 'stats') renderStatsView();
  else renderPageView();
  mountFamilyCorner();
  renderContext();
  syncHash();
}

// 把当前视图写进地址栏，方便收藏 / 刷新后回到同一页
function syncHash(){
  try {
    const want = (state.view === 'page' || state.view === 'selftest') ? '' : '#' + state.view;
    const have = location.hash || '';
    if (want === have) return;
    if (history && history.replaceState){
      history.replaceState(null, '', location.pathname + location.search + want);
    } else {
      location.hash = want;
    }
  } catch (e) { /* file:// 下可能不允许，忽略即可 */ }
}

/* =========================================================================
   8. 事件
   ========================================================================= */

document.addEventListener('click', function(e){
  const t = e.target;
  if (!t || typeof t.closest !== 'function') return;

  const viewEl = t.closest('[data-view]');
  if (viewEl){ state.view = viewEl.dataset.view; state.editing = false; render(); return; }

  const scopeEl = t.closest('[data-scope]');
  if (scopeEl){ state.tableScope = scopeEl.dataset.scope; render(); return; }

  const modeEl = t.closest('[data-pagemode]');
  if (modeEl){ state.pageMode = modeEl.dataset.pagemode; render(); return; }

  if (t.id === 'btnSelfTest' || t.id === 'selfTest'){
    state.view = 'selftest'; state.editing = false; render(); return;
  }

  if (t.closest('[data-famroll]')){
    pickFamily();
    render();                    // 页面视图由 renderPageView 重绘，不能用 mountFamilyCorner
    return;
  }

  // 🔊 朗读名言（中文 / 英文各一个喇叭）—— 必须排在展开逻辑前面，
  // 因为喇叭就嵌在 .fc-body 里面
  const spk = t.closest('[data-say]');
  if (spk){
    speakText(spk, spk.dataset.say, spk.dataset.lang);
    return;
  }

  // 名言默认截断到 3 行，点一下展开全文
  const famQuote = t.closest('[data-famquote]');
  if (famQuote){ famQuote.classList.toggle('on'); return; }

  const qs = t.closest('[data-quicksearch]');
  if (qs){
    state.view = 'search';
    state.search = qs.dataset.quicksearch;
    state.editing = false;
    render();
    return;
  }

  const goto = t.closest('[data-goto]');
  if (goto){ e.preventDefault(); go(goto.dataset.goto); return; }

  const newPage = t.closest('[data-new]');
  if (newPage){
    const name = newPage.dataset.new;
    const path = 'pages/' + name + '.md';
    if (!RAW[path] && !EDITS[path]) setContent(path, '- type:: 页面\n- # '+name+'\n- ');
    go(path);
    return;
  }

  const tagEl = t.closest('[data-tag]');
  if (tagEl){
    state.view = 'search'; state.search = '#'+tagEl.dataset.tag; state.editing = false;
    render(); return;
  }

  if (t.id === 'btnEdit'){ startEdit(); return; }
  if (t.id === 'btnCancel'){ state.editing = false; render(); return; }
  if (t.id === 'btnRevert'){ if (state.path) revert(state.path); state.editing = false; render(); return; }

  // 移除顶部的提炼内容，把文件还原成纯原文
  if (t.id === 'btnStripHead' || t.id === 'btnStripHead2'){
    if (!state.path) return;
    const ta = document.getElementById('editor');
    if (t.id === 'btnStripHead' && ta) setContent(state.path, ta.value);   // 先落盘编辑框内容
    if (!splitConcise(content(state.path)).has){
      toast('这篇没有顶部提炼内容。', 'err');
      return;
    }
    if (!confirm('会删掉本页顶部「## ✨ 核心内容」那一整段，连同 --- 分隔线。\n\n'
               + '分隔线以下的原文完整保留，一个字符都不会动。\n\n继续吗？')) return;
    stripHeadBlock(state.path);
    if (t.id === 'btnStripHead'){
      const ta2 = document.getElementById('editor');
      if (ta2) ta2.value = content(state.path);
      render();
    } else {
      render();
    }
    toast('🧹 顶部提炼内容已移除，页面现在只剩你的原文。', 'ok');
    return;
  }

  // 删除一页 / 恢复一页
  if (t.id === 'btnDelete' || t.id === 'btnDelete2'){
    if (!state.path) return;
    const path = state.path;

    if (t.id === 'btnDelete2'){
      const ta = document.getElementById('editor');
      if (ta) setContent(path, ta.value);   // 先把编辑框落盘，好让「恢复」有东西可还原
    }

    const inRaw = Object.prototype.hasOwnProperty.call(RAW, path);
    if (!confirm('删除「' + title(path) + '」？\n\n'
      + (inRaw
          ? '这一页来自内嵌图库。删掉后会从列表里消失，但图库本体写在 HTML 里，删不掉。\n'
          : '这一页只存在于浏览器里。\n')
      + '侧栏底部会出现「🗑 已删除」，点一下就能恢复。\n\n'
      + '注意：只影响浏览器本地，磁盘上的 .md 文件要你自己处理。')) return;

    deletePage(path);
    state.editing = false;

    const rest = allPaths();
    const nextJournal = rest.filter(isJournal)[0];
    state.path = nextJournal || rest[0] || '';
    state.view = state.path ? 'page' : 'table';
    pickFamily();
    render();
    toast('🗑 已删除「' + title(path) + '」。\n侧栏底部的「🗑 已删除」里可以恢复。', 'ok');
    return;
  }

  const restoreEl = t.closest('[data-restore]');
  if (restoreEl){
    const p = restoreEl.dataset.restore;
    restorePage(p);
    render();
    toast('↺ 已恢复「' + title(p) + '」。', 'ok');
    return;
  }
  if (t.id === 'btnSave'){
    const ta = document.getElementById('editor');
    if (ta && state.path){
      const path = state.path;
      setContent(path, composeFile(path, ta.value));   // 先把原文存好，AI 区原样保留
      state.editing = false;
      render();
      extractToSections(path);                          // 再让 AI 重写那四个小节
    }
    return;
  }
  if (t.id === 'btnDownload' || t.id === 'btnDownload2'){
    const ta = document.getElementById('editor');
    download(state.path, ta ? ta.value : content(state.path));
    return;
  }

  /* ---------- AI 提炼 ---------- */
  if (t.id === 'btnAI'){
    const ta = document.getElementById('editor');
    if (ta && state.path) setContent(state.path, composeFile(state.path, ta.value));
    if (state.path) extractToSections(state.path);
    return;
  }

  // 阅读页面直接点「AI 整理」：先进编辑器，再立刻整理
  if (t.id === 'btnAIFromView'){
    state.editing = true;
    render();
    doAIOrganize();
    return;
  }

  // 一键自检：不写日记也能确认整条链路通不通
  if (t.id === 'btnAITest'){
    AI_UI = { mode:'result', busy:false, result:'', err:false, msg:'正在测试连接…' };
    paintAIPanel();
    aiChat([{ role:'user', content:'只回复两个字：可用' }])
      .then(function(out){
        AI_UI = { mode:'result', busy:false, result:'', err:false,
                  msg:'✅ 连接成功\n接口：' + aiEndpoint() + '\n模型：' + AI_CFG.model
                    + '\n模型回复：' + (out || '(空)') };
        paintAIPanel();
      })
      .catch(function(e){
        AI_UI = { mode:'result', busy:false, result:'', err:true,
                  msg:'❌ 连接失败\n' + (e && e.message ? e.message : String(e))
                    + (e && e.hint ? '\n\n' + e.hint : '') };
        paintAIPanel();
      });
    return;
  }

  if (t.id === 'btnAICfg'){
    AI_UI.mode = (AI_UI.mode === 'cfg' ? '' : 'cfg');
    AI_UI.busy = false;
    paintAIPanel();
    return;
  }

  if (t.id === 'btnAISaveCfg'){
    const b = document.getElementById('aiBaseUrl');
    const m = document.getElementById('aiModel');
    const k = document.getElementById('aiKey');
    if (b) AI_CFG.baseUrl = b.value.trim();
    if (m) AI_CFG.model   = m.value.trim();
    if (k) AI_CFG.apiKey  = k.value.trim();
    const th = document.getElementById('aiThinking');
    if (th) AI_CFG.thinking = !!th.checked;

    const prov = document.querySelector('input[name="ttsProv"]:checked');
    if (prov) AI_CFG.ttsProvider = prov.value;
    [['ttsAppId','ttsAppId'], ['ttsToken','ttsToken'], ['ttsCluster','ttsCluster'],
     ['ttsResourceId','ttsResourceId'], ['ttsVoiceZh','ttsVoiceZh'], ['ttsVoiceEn','ttsVoiceEn']
    ].forEach(function(pair){
      const el = document.getElementById(pair[0]);
      if (el) AI_CFG[pair[1]] = el.value.trim();
    });

    aiSaveCfg();
    AI_UI = { mode:'result', busy:false, result:'', err:false,
              msg:'设置已保存。\n接口：' + aiEndpoint() + '\n模型：' + AI_CFG.model
                + '\n思考模式：' + (AI_CFG.thinking ? '开启' : '关闭') };
    paintAIPanel();
    return;
  }



  // 追加到原文末尾：原文已有内容不动，只在后面接一段
  if (t.id === 'btnAIAppend'){
    const ta = document.getElementById('editor');
    const out = document.getElementById('aiOut');
    if (ta && out){
      ta.value = ta.value.replace(/\s+$/, '') + '\n\n' + out.value + '\n';
    }
    AI_UI = { mode:'', busy:false, result:'', msg:'', err:false };
    paintAIPanel();
    return;
  }

  if (t.id === 'btnAIDiscard'){
    AI_UI = { mode:'', busy:false, result:'', msg:'', err:false };
    paintAIPanel();
    return;
  }

  /* ---------- AI 工作台 ---------- */
  if (t.id === 'btnAITestView'){
    setAIStatus('正在测试连接……');
    aiChat([{ role:'user', content:'只回复两个字：可用' }])
      .then(function(out){
        setAIStatus('✅ 连接成功\n模型 ' + AI_CFG.model + ' 回复：' + (out || '(空)'));
      })
      .catch(function(e){
        setAIStatus('❌ 连接失败\n' + (e && e.message ? e.message : String(e))
          + (e && e.hint ? '\n' + e.hint : ''));
      });
    return;
  }

  if (t.id === 'btnAICfgView'){
    AI_UI.mode = (AI_UI.mode === 'cfg' ? '' : 'cfg');
    AI_UI.busy = false;
    paintAIPanel();
    return;
  }

  if (t.id === 'btnAILoadPage'){
    if (state.path){
      // 同样只载入原文，跳过顶部的核心内容
      const all = content(state.path);
      const v   = splitConcise(all).original;
      AI_VIEW.input = v;
      const inp = document.getElementById('aiInput');
      if (inp) inp.value = v;
      setAIStatus('已载入「' + title(state.path) + '」的原文'
        + (v.length < all.length ? '（顶部的核心内容已跳过）' : '') + '。');
    }
    return;
  }

  if (t.id === 'btnAIViewRun'){ runAIView(); return; }

  if (t.id === 'btnAICopyOut'){
    const out = document.getElementById('aiOutput');
    if (out && out.value){
      AI_VIEW.output = out.value;
      copyText(out.value);
      setAIStatus('已复制到剪贴板。');
    } else {
      setAIStatus('还没有结果可以复制。');
    }
    return;
  }

  if (t.id === 'btnAIToPage'){
    const out = document.getElementById('aiOutput');
    if (!out || !out.value){ setAIStatus('还没有结果。'); return; }
    if (!state.path){ setAIStatus('当前没有打开任何页面。'); return; }
    AI_VIEW.output = out.value;
    setContent(state.path, content(state.path).replace(/\s+$/, '') + '\n\n' + out.value);
    setAIStatus('已追加到「' + title(state.path) + '」。\n'
      + '注意：只存在浏览器本地，要落盘请打开那页点「下载 .md」。');
    return;
  }

  /* ---------- 日历 ---------- */
  if (t.id === 'calPrev'){
    calInit();
    CAL.month--;
    if (CAL.month < 1){ CAL.month = 12; CAL.year--; }
    render(); return;
  }
  if (t.id === 'calNext'){
    calInit();
    CAL.month++;
    if (CAL.month > 12){ CAL.month = 1; CAL.year++; }
    render(); return;
  }
  if (t.id === 'calToday'){
    CAL = { year: TODAY.getFullYear(), month: TODAY.getMonth() + 1 };
    render(); return;
  }

  const calCell = t.closest('[data-caldate]');
  if (calCell){ openCalendarDay(calCell.dataset.caldate); return; }

  if (t.id === 'btnReset'){
    if (confirm('确定要清空你在浏览器里的所有修改吗？\n\n'
      + '这会把每一页都还原成图库原始内容，并恢复全部已删除的页面。\n'
      + '此操作不可撤销。')){
      EDITS = {}; DELETED = {};
      persist(); persistDeleted();
      state.editing = false;
      render();
      toast('已还原成图库原始内容（含恢复已删除的页面）。', 'ok');
    }
    return;
  }
});

document.addEventListener('input', function(e){
  if (e.target.id === 'searchBox'){
    state.search = e.target.value;
    renderSearchResults();   // 只重绘结果区，不动输入框（保护中文输入法）
  }
});

function download(path, text){
  const blob = new Blob([text], { type:'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = baseName(path) + '.md';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* ---------- 启动 ---------- */
try {
  // 支持直接打开某个视图：index.html#calendar / #table / #ai / #stats / #search
  const HASH_VIEWS = ['calendar','table','ai','search','stats','selftest'];
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (HASH_VIEWS.indexOf(h) >= 0) state.view = h;
  } catch (e) { /* file:// 下偶尔不让读，忽略 */ }

  state.path = 'journals/' + ymd(TODAY) + '.md';
  if (allPaths().indexOf(state.path) < 0) state.path = 'pages/工作手册.md';
  pickFamily();                  // 首次打开也随机一位
  render();
  refreshSelfTestBadge();
} catch (err) {
  window.showFatal('启动失败', (err && err.message) || String(err));
}
